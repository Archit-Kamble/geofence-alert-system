# Starts the whole system:  docker compose up --build
#   Frontend  http://localhost:5173
#   Backend   http://localhost:8080
services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: geofence
      POSTGRES_PASSWORD: geofence
      POSTGRES_DB: geofence
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U geofence -d geofence"]
      interval: 3s
      timeout: 3s
      retries: 20

  backend:
    build: ./backend
    image: architkamble/geofence-backend:latest
    environment:
      DATABASE_URL: postgres://geofence:geofence@db:5432/geofence?sslmode=disable
      PORT: "8080"
      ALLOWED_ORIGINS: "*"
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:8080
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  db-data:
